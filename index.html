<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Pulse</title>

<style>
* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fb;
  color: #17324d;
}

button, textarea, select { font-family: inherit; }
button { cursor: pointer; }

.header {
  background: #fff;
  border-bottom: 1px solid #e4e9ef;
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1120px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon { font-size: 31px; }

.brand-title {
  font-size: 24px;
  font-weight: 750;
  color: #102f54;
}

.brand-subtitle {
  font-size: 13px;
  color: #75879a;
  margin-top: 2px;
}

.nav {
  display: flex;
  gap: 8px;
}

.nav-button {
  border: 0;
  background: transparent;
  color: #52667a;
  padding: 10px 14px;
  border-radius: 20px;
  font-weight: 600;
}

.nav-button:hover {
  background: #f1f5fa;
}

.nav-button.active {
  background: #eaf2ff;
  color: #1769e0;
}


/* TEAM CODE LOGIN */
#appContent { display:none; }
.login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg,#eef5ff,#f7f4ff); }
.login-card { width:100%; max-width:430px; background:white; border:1px solid #e1e7ee; border-radius:22px; padding:34px; box-shadow:0 18px 50px rgba(30,55,80,.12); text-align:center; }
.login-icon { width:62px; height:62px; margin:0 auto 17px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:#edf3ff; font-size:29px; }
.login-title { font-size:28px; font-weight:800; color:#102f54; }
.login-subtitle { margin-top:7px; color:#718397; font-size:14px; }
.login-input { width:100%; margin-top:25px; border:1px solid #ccd6e0; border-radius:11px; padding:13px 14px; font-size:16px; outline:none; }
.login-input:focus { border-color:#2475e8; box-shadow:0 0 0 3px rgba(36,117,232,.10); }
.login-button { width:100%; margin-top:12px; border:0; border-radius:11px; padding:13px; background:#2475e8; color:white; font-size:15px; font-weight:750; }
.login-button:disabled { opacity:.6; cursor:wait; }
.login-error { display:none; margin-top:13px; padding:10px 12px; border-radius:9px; background:#fff0f0; color:#b12d2d; font-size:13px; }
.login-note { margin-top:18px; color:#94a1ae; font-size:12px; line-height:1.45; }
.logout-button { border:1px solid #dbe3ec; background:white; color:#60758a; padding:8px 12px; border-radius:18px; font-weight:700; font-size:12px; }

/* ACADEMIC CALENDAR */

.academic-section {
  padding: 22px 24px 0;
  scroll-margin-top: 90px;
}

.academic-card {
  max-width: 1120px;
  margin: auto;
  background: linear-gradient(135deg, #123663, #1e5a94);
  color: white;
  border-radius: 18px;
  padding: 24px 26px;
  box-shadow: 0 8px 24px rgba(18,46,80,.14);
}

.academic-heading-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-start;
}

.academic-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .7px;
  color: #b9d5f2;
  margin-bottom: 7px;
}

.academic-title {
  font-size: 30px;
  font-weight: 750;
  margin: 0;
}

.academic-description {
  color: #d5e5f5;
  font-size: 14px;
  margin-top: 6px;
}

.today-badge {
  background: rgba(255,255,255,.12);
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
  color: #e7f2fc;
  white-space: nowrap;
}

.countdown-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 22px;
}

.countdown-card {
  border-radius: 14px;
  padding: 18px 20px;
  min-height: 125px;
}

.start-countdown {
  background: linear-gradient(135deg,#e6f1ff,#cfe5ff);
  color: #123663;
}

.census-countdown {
  background: linear-gradient(135deg,#e5f9ef,#cef2df);
  color: #126648;
}

.countdown-heading {
  font-size: 12px;
  font-weight: 750;
  margin-bottom: 8px;
}

.countdown-content {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 15px;
}

.big-countdown {
  font-size: 40px;
  line-height: 1;
  font-weight: 800;
  white-space: nowrap;
}

.big-countdown span {
  font-size: 15px;
}

.week-countdown {
  text-align: right;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
}

.countdown-date {
  font-size: 12px;
  font-weight: 500;
  opacity: .82;
  margin-top: 3px;
}

.timeline {
  margin-top: 26px;
  padding-top: 13px;
}

.timeline-line {
  height: 7px;
  background: rgba(255,255,255,.22);
  border-radius: 20px;
  overflow: hidden;
}

.timeline-progress {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg,#7cc7ff,#7de0c1);
  border-radius: 20px;
}

.timeline-dates {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  margin-top: 10px;
}

.timeline-item {
  font-size: 12px;
  color: #d8e8f7;
}

.timeline-item:nth-child(2) { text-align:center; }
.timeline-item:nth-child(3) { text-align:right; }

.timeline-name {
  font-weight: 700;
  color: white;
  margin-bottom: 3px;
}


/* THIS WEEK */

.hero {
  background: linear-gradient(135deg,#eaf4ff,#f7fbff);
  border-bottom: 1px solid #dfe8f2;
  margin-top: 22px;
  padding: 28px 24px;
  scroll-margin-top: 90px;
}

.hero-inner {
  max-width: 1120px;
  margin: auto;
}

.week-label {
  color: #60758a;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.week-title {
  font-size: 30px;
  font-weight: 750;
  margin: 0;
  color: #102f54;
}

.week-message {
  color: #60758a;
  margin-top: 8px;
}


/* MAIN */

.container {
  max-width: 1120px;
  margin: 26px auto;
  padding: 0 24px 40px;
}

.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.card {
  background: white;
  border-radius: 18px;
  border: 1px solid #e1e7ee;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(30,55,80,.05);
}

.card-header { padding:22px; }
.focus-header { background:#edf5ff; }
.win-header { background:#edf9f1; }

.day-label {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.card-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 7px;
  color: #102f54;
}

.card-question {
  color:#63768a;
  font-size:14px;
}

.add-button {
  margin-top:16px;
  border:none;
  border-radius:10px;
  padding:11px 17px;
  font-weight:700;
}

.focus-button {
  background:#2475e8;
  color:white;
}

.win-button {
  background:#149557;
  color:white;
}


/* PEOPLE */

.people { padding:0 22px; }

.person {
  display:flex;
  gap:14px;
  padding:20px 0;
  border-bottom:1px solid #edf0f4;
}

.person:last-child { border-bottom:none; }

.avatar {
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-weight:750;
}

.avatar.nikki {
  background:#ffe5f0;
  color:#cc3976;
}

.avatar.penny {
  background:#e5efff;
  color:#1769e0;
}

.avatar.megan {
  background:#eee8ff;
  color:#7254c7;
}

.person-content { flex:1; }

.person-name {
  font-weight:700;
  margin-bottom:7px;
}

.empty {
  color:#8a99a8;
  font-style:italic;
}

.update-item {
  background:#f7f9fc;
  border-radius:11px;
  padding:11px 12px;
  margin-top:8px;
}

.update-text {
  line-height:1.45;
  font-size:14px;
  color:#42576c;
  white-space:pre-wrap;
  word-break:break-word;
}

.update-actions {
  display:flex;
  gap:12px;
  margin-top:9px;
}

.edit-button,
.delete-button {
  border:none;
  background:transparent;
  padding:4px 0;
  font-size:12px;
  font-weight:700;
}

.edit-button { color:#2475e8; }
.delete-button { color:#c44343; }


/* COMPACT CURRENT WEEK */
.people .person {
  padding: 14px 0;
  align-items: flex-start;
}

.people .person-name {
  margin-bottom: 4px;
}

.people .update-item {
  padding: 9px 11px 7px;
  margin-top: 5px;
  min-height: 0;
  height: auto;
}

.people .update-text {
  line-height: 1.4;
}

.people .update-actions {
  margin-top: 5px;
  gap: 10px;
  line-height: 1;
}

.people .update-actions .edit-button,
.people .update-actions .delete-button {
  padding: 2px 0;
  font-size: 11px;
}


/* EXTRA COMPACT CURRENT WEEK + REMOVE LEADING DISPLAY WHITESPACE */
.people {
  padding: 0 16px;
}

.people .person {
  padding: 9px 0;
  gap: 10px;
}

.people .avatar {
  width: 36px;
  height: 36px;
}

.people .person-name {
  margin-bottom: 2px;
}

.people .update-item {
  margin-top: 3px;
  padding: 7px 9px 6px;
  border-radius: 9px;
}

.people .update-text {
  line-height: 1.35;
  white-space: normal;
  margin: 0;
}

.people .update-actions {
  margin-top: 4px;
}

/* History text: preserve intentional line breaks, but not template indentation */
.history-entry {
  white-space: normal;
}


/* PREVIOUS WEEKS */

.previous-section {
  margin-top: 26px;
  scroll-margin-top: 90px;
}

.section-heading-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 15px;
}

.section-eyebrow {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .5px;
  color: #74879a;
  margin-bottom: 5px;
}

.section-title {
  margin: 0;
  font-size: 24px;
  color: #102f54;
}

.section-description {
  font-size: 13px;
  color: #718397;
  margin-top: 5px;
}

.history-count {
  background: #edf3fb;
  color: #536d86;
  padding: 7px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.previous-empty {
  background: white;
  border: 1px dashed #cad5df;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
  color: #7b8c9c;
}

.history-week {
  background: white;
  border: 1px solid #e1e7ee;
  border-radius: 16px;
  margin-bottom: 13px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(30,55,80,.04);
}

.history-week-header {
  width: 100%;
  border: none;
  background: white;
  padding: 17px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
  gap: 15px;
}

.history-week-header:hover {
  background: #f9fbfd;
}

.history-week-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.history-calendar {
  width: 39px;
  height: 39px;
  background: #edf4ff;
  color: #2475e8;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.history-week-title {
  color: #173a5e;
  font-weight: 750;
  font-size: 16px;
}

.history-week-summary {
  color: #8292a2;
  font-size: 12px;
  margin-top: 3px;
}

.history-arrow {
  color: #73879a;
  font-size: 17px;
  transition: transform .2s;
}

.history-week.open .history-arrow {
  transform: rotate(180deg);
}

.history-body {
  display: none;
  border-top: 1px solid #edf0f4;
  padding: 6px 20px 20px;
}

.history-week.open .history-body {
  display: block;
}

.history-person {
  display: grid;
  grid-template-columns: 145px 1fr 1fr;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid #edf0f4;
  align-items: start;
}

.history-person:last-child {
  border-bottom: none;
}

.history-person-info {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.history-person .avatar {
  width: 34px;
  height: 34px;
  font-size: 13px;
}

.history-person-name {
  font-weight: 700;
  color: #173a5e;
  padding-top: 8px;
}

.history-column-title {
  font-size: 11px;
  font-weight: 750;
  letter-spacing: .3px;
  margin-bottom: 7px;
}

.history-focus-title { color: #2475e8; }
.history-win-title { color: #149557; }

.history-entry {
  background: #f7f9fc;
  padding: 9px 11px 7px;
  border-radius: 9px;
  font-size: 13px;
  color: #4c6175;
  line-height: 1.4;
  margin-bottom: 6px;
  white-space: pre-wrap;
  word-break: break-word;
  height: auto;
  min-height: 0;
}

.history-no-entry {
  color: #9aa7b3;
  font-size: 13px;
  font-style: italic;
}


.history-entry .update-actions {
  margin-top: 5px;
  gap: 10px;
  line-height: 1;
}

.history-entry .edit-button,
.history-entry .delete-button {
  padding: 2px 0;
  font-size: 11px;
}

.history-body {
  padding-bottom: 10px;
}


/* MATCH PREVIOUS WEEK ACTIONS TO CURRENT WEEK */
.history-entry .update-actions {
  margin-top: 4px;
  gap: 10px;
  line-height: 1;
}

.history-entry .edit-button,
.history-entry .delete-button {
  padding: 2px 0;
  font-size: 11px;
}


/* FINAL PREVIOUS WEEK FIX
   Do not preserve HTML template indentation as visible whitespace. */
.history-entry {
  white-space: normal !important;
  padding: 7px 9px 6px;
  line-height: 1.35;
}

.history-entry > div:first-child {
  margin: 0;
  padding: 0;
  white-space: normal;
  line-height: 1.35;
}

.history-entry .update-actions {
  margin: 4px 0 0 0 !important;
  padding: 0;
  gap: 10px;
  min-height: 0;
}


/* YEAR */

.year-section {
  margin-top: 22px;
  scroll-margin-top: 90px;
}

.year-card {
  background:white;
  border:1px solid #e1e7ee;
  border-radius:18px;
  padding:24px;
  box-shadow:0 4px 18px rgba(30,55,80,.05);
}

.year-top {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.year-title {
  font-weight:750;
  font-size:24px;
  color:#102f54;
}

.year-subtitle {
  color:#718397;
  font-size:13px;
  margin-top:5px;
}

.year-tabs {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.year-tab {
  border:1px solid #dbe3ec;
  background:#f8fafc;
  color:#53697e;
  border-radius:20px;
  padding:9px 14px;
  font-weight:700;
}

.year-tab:hover {
  background:#f0f4f8;
}

.year-tab.active {
  background:#7453d8;
  border-color:#7453d8;
  color:white;
}

.summary-stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat {
  background:#f4f7fb;
  border-radius:14px;
  text-align:center;
  padding:19px 10px;
}

.stat-number {
  font-size:28px;
  font-weight:800;
  color:#1769e0;
}

.stat-label {
  font-size:12px;
  color:#718397;
  margin-top:5px;
  font-weight:700;
}

.year-divider {
  height:1px;
  background:#e8edf2;
  margin:24px 0 20px;
}

.monthly-heading {
  font-size:18px;
  font-weight:750;
  color:#102f54;
}

.monthly-description {
  color:#718397;
  font-size:13px;
  margin-top:4px;
  margin-bottom:15px;
}

.month-card {
  border:1px solid #e2e8ef;
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}

.month-header {
  width:100%;
  border:0;
  background:#fafbfd;
  padding:15px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  text-align:left;
}

.month-header:hover {
  background:#f5f8fb;
}

.month-title {
  font-weight:750;
  color:#173a5e;
  font-size:15px;
}

.month-summary {
  color:#8292a2;
  font-size:12px;
  margin-top:3px;
}

.month-arrow {
  color:#73879a;
  transition:transform .2s;
}

.month-card.open .month-arrow {
  transform:rotate(180deg);
}

.month-body {
  display:none;
  padding:5px 17px 17px;
  border-top:1px solid #edf0f4;
}

.month-card.open .month-body {
  display:block;
}

.month-person {
  padding:15px 0;
  border-bottom:1px solid #edf0f4;
}

.month-person:last-child {
  border-bottom:0;
}

.month-person-heading {
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:11px;
}

.month-person-heading .avatar {
  width:32px;
  height:32px;
  font-size:12px;
}

.month-person-name {
  font-weight:750;
  color:#173a5e;
}

.month-columns {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.month-column-title {
  font-size:11px;
  font-weight:750;
  letter-spacing:.3px;
  margin-bottom:7px;
}

.month-focus-title { color:#2475e8; }
.month-win-title { color:#149557; }

.month-entry {
  background:#f7f9fc;
  padding:10px 11px;
  border-radius:9px;
  margin-bottom:6px;
}

.month-entry-week {
  color:#8a99a8;
  font-size:11px;
  font-weight:700;
  margin-bottom:4px;
}

.month-entry-text {
  color:#4c6175;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.month-empty {
  color:#9aa7b3;
  font-size:13px;
  font-style:italic;
}

.year-empty {
  border:1px dashed #cad5df;
  border-radius:13px;
  padding:25px;
  text-align:center;
  color:#7b8c9c;
  background:#fafbfd;
}

.year-button {
  width:100%;
  margin-top:18px;
  border:none;
  background:#7453d8;
  color:white;
  border-radius:10px;
  padding:13px;
  font-weight:700;
}

.year-button:disabled {
  opacity:.55;
  cursor:not-allowed;
}


/* COMPACT ANNUAL RECORD / MONTHLY HIGHLIGHTS */
.month-person {
  padding: 9px 0;
}

.month-person-heading {
  margin-bottom: 7px;
  gap: 7px;
}

.month-person-heading .avatar {
  width: 28px;
  height: 28px;
}

.month-columns {
  gap: 10px;
}

.month-column-title {
  margin-bottom: 5px;
}

.month-entry {
  padding: 7px 9px 6px;
  margin-bottom: 5px;
  border-radius: 8px;
  min-height: 0;
  height: auto;
}

.month-entry-week {
  margin-bottom: 2px;
}

.month-entry-text {
  line-height: 1.35;
  white-space: normal;
  margin: 0;
}

.month-body {
  padding: 4px 14px 10px;
}


/* MODAL */

.modal-backdrop {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,35,55,.52);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.show { display:flex; }

.modal {
  background:white;
  width:100%;
  max-width:520px;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
  overflow:hidden;
}

.modal-header {
  padding:22px 24px 16px;
  border-bottom:1px solid #edf0f4;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title {
  font-size:21px;
  font-weight:750;
  color:#102f54;
}

.close-button {

/* SMART YEAR KEYWORD + PHRASE CLOUD */

const keywordStopWords = new Set([
  "the","and","for","with","that","this","from","into","onto","than","then","they","them","their",
  "there","here","have","has","had","will","would","could","should","can","may","might","must",
  "are","was","were","been","being","is","am","be","to","of","in","on","at","by","as","or","an","a",
  "it","its","we","our","us","i","my","me","you","your","he","she","his","her","who","what","when",
  "where","why","how","not","no","yes","do","does","did","done","get","got","make","made","work",
  "working","week","weekly","focus","focused","win","wins","update","updates","team","main","key",
  "new","next","also","more","very","all","some","any","about","across","through","up","out","over",
  "after","before","during","today","tomorrow","monday","tuesday","wednesday","thursday","friday",
  "complete","completed","continue","continued","prepare","prepared","review","reviewed","previous"
]);

/* Conservative aliases only — avoids destructive stemming such as analysis → analysi. */
const keywordAliases = {
  "analyses":"analysis",
  "applications":"application",
  "applicants":"applicant",
  "enrolments":"enrolment",
  "enrollments":"enrollment",
  "students":"student",
  "courses":"course",
  "reports":"report",
  "dashboards":"dashboard",
  "meetings":"meeting",
  "flights":"flight",
  "forecasts":"forecast",
  "strategies":"strategy",
  "markets":"market"
};

function normaliseKeyword(word) {
  const clean = String(word || "")
    .toLowerCase()
    .replace(/^['’]+|['’]+$/g,"");
  return keywordAliases[clean] || clean;
}

function smartTokenise(text) {
  const rawWords = String(text || "")
    .replace(/[–—/]/g," ")
    .match(/[A-Za-z][A-Za-z0-9&'’-]{1,}/g) || [];

  return rawWords.map(raw => {
    const key = normaliseKeyword(raw);
    const acronym = raw.length <= 7 && raw === raw.toUpperCase();
    const label = acronym ? raw : key.charAt(0).toUpperCase() + key.slice(1);
    return {
      raw,
      key,
      label,
      useful: key.length >= 3 && !keywordStopWords.has(key) && !/^\d+$/.test(key)
    };
  });
}

function buildKeywordCounts(records) {
  const items = new Map();

  function addItem(key, label, score, mentions, isPhrase=false) {
    if (!key) return;
    const existing = items.get(key) || { key, label, score:0, mentions:0, isPhrase };
    existing.score += score;
    existing.mentions += mentions;
    if (isPhrase) existing.isPhrase = true;
    items.set(key, existing);
  }

  records.forEach(record => {
    const tokens = smartTokenise(record.text);
    const weight = record.type === "win" ? 1.3 : 1.0;

    /* Single concepts */
    tokens.forEach(token => {
      if (!token.useful) return;
      addItem(token.key, token.label, weight, 1, false);
    });

    /* Meaningful two-word phrases. Stopwords break phrases rather than being removed. */
    for (let i = 0; i < tokens.length - 1; i++) {
      const a = tokens[i];
      const b = tokens[i + 1];
      if (!a.useful || !b.useful) continue;
      if (a.key === b.key) continue;

      const phraseKey = `${a.key} ${b.key}`;
      const phraseLabel = `${a.label} ${b.label}`;
      addItem(phraseKey, phraseLabel, weight * 1.55, 1, true);
    }

    /* Three-word phrases are included only when all three words are meaningful. */
    for (let i = 0; i < tokens.length - 2; i++) {
      const a = tokens[i], b = tokens[i + 1], c = tokens[i + 2];
      if (!a.useful || !b.useful || !c.useful) continue;
      const phraseKey = `${a.key} ${b.key} ${c.key}`;
      const phraseLabel = `${a.label} ${b.label} ${c.label}`;
      addItem(phraseKey, phraseLabel, weight * 1.8, 1, true);
    }
  });

  let ranked = [...items.values()];

  /* Repeated phrases are especially informative; one-off long phrases are kept,
     but ranked below recurring concepts. */
  ranked.forEach(item => {
    if (item.isPhrase && item.mentions >= 2) item.score *= 1.25;
  });

  return ranked
    .sort((a,b) => b.score - a.score || b.mentions - a.mentions || a.label.localeCompare(b.label))
    .slice(0,45);
}

function renderKeywordCloud() {
  const cloud = document.getElementById("keywordCloud");
  const description = document.getElementById("keywordCloudDescription");
  if (!cloud) return;

  const records = getYearRecords();
  const words = buildKeywordCounts(records);

  if (description) {
    description.textContent = selectedYearPerson === "Team"
      ? "Smart themes and phrases drawn from the team's Focus and Wins."
      : `Smart themes and phrases drawn from ${selectedYearPerson}'s Focus and Wins.`;
  }

  if (!words.length) {
    cloud.innerHTML = "<div class=\"keyword-cloud-empty\">Add more Focus and Wins to build the year's keyword cloud.</div>";
    return;
  }

  const max = Math.max(...words.map(w => w.score));
  const min = Math.min(...words.map(w => w.score));
  const palette = ["#1769e0","#7453d8","#149557","#c46b24","#42576c"];

  cloud.innerHTML = words.map((word,index) => {
    const ratio = max === min ? 0.55 : (word.score - min) / (max - min);
    const size = Math.round(14 + ratio * 28);
    const weight = Math.round(650 + ratio * 180);
    const color = palette[index % palette.length];
    const mentions = `${word.mentions} ${word.mentions === 1 ? "mention" : "mentions"}`;
    const kind = word.isPhrase ? "phrase" : "keyword";
    return `<span class="keyword-word"
      style="font-size:${size}px;font-weight:${weight};color:${color}"
      title="${escapeHTML(word.label)} · ${mentions} · ${kind}">${escapeHTML(word.label)}</span>`;
  }).join("");
}


/* ANNOUNCEMENTS */
let allAnnouncements = [];
let editingAnnouncementId = null;

async function loadAnnouncements() {
  try {
    const response = await fetch("/api/announcements", { headers: authHeaders() });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to load announcements.");
    allAnnouncements = data.announcements || [];
    renderAnnouncementBar();
    renderAnnouncementList();
    return true;
  } catch (error) { console.error(error); return false; }
}

function activeAnnouncements() {
  const today = formatISODate(startOfDay(new Date()));
  return allAnnouncements.filter(a => !a.expires_at || a.expires_at >= today);
}

function renderAnnouncementBar() {
  const track = document.getElementById("noticeTrack");
  if (!track) return;
  const active = activeAnnouncements();
  if (!active.length) { track.innerHTML = '<span class="notice-empty">No active announcements.</span>'; return; }
  track.innerHTML = active.map(a => `<span><strong>${escapeHTML(a.person)}</strong> · ${escapeHTML(a.text)}</span>`).join('<span class="notice-separator">•</span>');
}

function renderAnnouncementList() {
  const list = document.getElementById("noticeList");
  if (!list) return;
  if (!allAnnouncements.length) { list.innerHTML = '<div class="year-empty">No announcements yet.</div>'; return; }
  list.innerHTML = allAnnouncements.map(a => `
    <div class="notice-list-item">
      <div class="notice-list-person">${escapeHTML(a.person)}</div>
      <div class="notice-list-text">${escapeHTML(a.text)}</div>
      <div class="notice-list-meta">${a.expires_at ? 'Expires ' + escapeHTML(a.expires_at) : 'No expiry date'}</div>
      <div class="notice-list-actions">
        <button class="edit-button" onclick="editAnnouncement(${a.id})">Edit</button>
        <button class="delete-button" onclick="deleteAnnouncement(${a.id})">Delete</button>
      </div>
    </div>`).join('');
}

function openNoticeModal() {
  editingAnnouncementId = null;
  document.getElementById("noticePerson").value = "";
  document.getElementById("noticeText").value = "";
  document.getElementById("noticeExpiry").value = "";
  document.getElementById("noticeSaveButton").textContent = "Add Announcement";
  document.getElementById("noticeMessage").className = "form-message";
  renderAnnouncementList();
  document.getElementById("noticeModal").classList.add("show");
}

function closeNoticeModal() { document.getElementById("noticeModal").classList.remove("show"); }

function editAnnouncement(id) {
  const a = allAnnouncements.find(x => Number(x.id) === Number(id));
  if (!a) return;
  editingAnnouncementId = Number(id);
  document.getElementById("noticePerson").value = a.person;
  document.getElementById("noticeText").value = a.text;
  document.getElementById("noticeExpiry").value = a.expires_at || "";
  document.getElementById("noticeSaveButton").textContent = "Save Changes";
}

async function saveAnnouncement() {
  const person = document.getElementById("noticePerson").value;
  const text = document.getElementById("noticeText").value.trim();
  const expires_at = document.getElementById("noticeExpiry").value || null;
  const message = document.getElementById("noticeMessage");
  const button = document.getElementById("noticeSaveButton");
  message.className = "form-message";
  if (!person || !text) { message.textContent = "Please select your name and enter an announcement."; message.className = "form-message error"; return; }
  button.disabled = true;
  try {
    const method = editingAnnouncementId ? "PATCH" : "POST";
    const body = { person, text, expires_at };
    if (editingAnnouncementId) body.id = editingAnnouncementId;
    const response = await fetch("/api/announcements", { method, headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify(body) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to save announcement.");
    editingAnnouncementId = null;
    document.getElementById("noticePerson").value = ""; document.getElementById("noticeText").value = ""; document.getElementById("noticeExpiry").value = "";
    document.getElementById("noticeSaveButton").textContent = "Add Announcement";
    await loadAnnouncements();
    message.textContent = "Announcement saved."; message.className = "form-message success";
  } catch (error) { message.textContent = error.message; message.className = "form-message error"; } finally { button.disabled = false; }
}

async function deleteAnnouncement(id) {
  if (!confirm("Delete this announcement?")) return;
  try {
    const response = await fetch("/api/announcements", { method:"DELETE", headers:authHeaders({"Content-Type":"application/json"}), body:JSON.stringify({id}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to delete announcement.");
    await loadAnnouncements();
  } catch (error) { alert(error.message); }
}

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;
}


/* CURRENT WEEK RENDER */

function renderUpdates() {

  const weekStart =
    formatISODate(
      getCurrentMonday()
    );

  const weekly =
    allUpdates.filter(

    );

function renderType(
  type,
  containerId,
  updates
) {

  let html = "";


  teamMembers.forEach(member => {

    const items =
      updates.filter(
        u =>
          u.person===member.name &&
          u.type===type
      );


    let itemHTML = "";


    if (!items.length) {

      itemHTML =
        `<div class="empty">
          ${
            type==="focus"
              ? "No focus shared yet."
              : "No wins shared yet."
          }
        </div>`;

    } else {

      items.forEach(update => {

        itemHTML += `
          <div class="update-item">

            <div class="update-text">
              ${escapeHTML(String(update.text || "").trim())}
            </div>

            <div class="update-actions">

              <button
                class="edit-button"
                onclick="openEditModal(${update.id})">
                Edit
              </button>

              <button
                class="delete-button"
                onclick="deleteUpdate(${update.id})">
                Delete
              </button>

            </div>

          </div>
        `;
      });
    }


    html += `
      <div class="person">

        <div class="avatar ${member.avatarClass}">
          ${member.initial}
        </div>

        <div class="person-content">

          <div class="person-name">
            ${member.name}
          </div>

          ${itemHTML}

        </div>

      </div>
    `;
  });


  document
    .getElementById(containerId)
    .innerHTML =
      html;
}


/* PREVIOUS WEEKS */

function renderPreviousWeeks() {

  const currentWeek =
    formatISODate(
      getCurrentMonday()
    );


  const previousUpdates =
    allUpdates.filter(
      update =>
        update.week_start < currentWeek
    );


  const weekStarts =
    [
      ...new Set(
        previousUpdates.map(
          update =>
            update.week_start
        )
      )
    ]
    .sort()
    .reverse();


  const count =
    weekStarts.length;


  document
    .getElementById("historyCount")
    .textContent =
      `${count} previous ${count===1 ? "week" : "weeks"}`;


  const container =
    document.getElementById(
      "previousWeeksContainer"
    );


  if (!count) {

    container.innerHTML =
      `<div class="previous-empty">
        No previous weeks yet.<br><br>
        This week's updates will automatically move here next week.
      </div>`;

    return;
  }


  let html = "";


  weekStarts.forEach(
    (weekStart,index) => {

      const weekUpdates =
        previousUpdates.filter(
          update =>
            update.week_start===weekStart
        );


      const focusTotal =
        weekUpdates.filter(
          update =>
            update.type==="focus"
        ).length;


      const winTotal =
        weekUpdates.filter(
          update =>
            update.type==="win"
        ).length;


      let peopleHTML = "";


      teamMembers.forEach(
        member => {

          const focuses =
            weekUpdates.filter(
              update =>
                update.person===member.name &&
                update.type==="focus"
            );


          const wins =
            weekUpdates.filter(
              update =>
                update.person===member.name &&
                update.type==="win"
            );


          const focusHTML =
            focuses.length
              ? focuses.map(
                  update =>
                    `<div class="history-entry">
                      <div>${escapeHTML(String(update.text || "").trim())}</div>
                      <div class="update-actions">
                        <button class="edit-button" onclick="openEditModal(${update.id})">Edit</button>
                        <button class="delete-button" onclick="deleteUpdate(${update.id})">Delete</button>
                      </div>
                    </div>`
                ).join("")
              : `<div class="history-no-entry">
                  No focus shared
                </div>`;


          const winHTML =
            wins.length
              ? wins.map(
                  update =>
                    `<div class="history-entry">
                      <div>${escapeHTML(String(update.text || "").trim())}</div>
                      <div class="update-actions">
                        <button class="edit-button" onclick="openEditModal(${update.id})">Edit</button>
                        <button class="delete-button" onclick="deleteUpdate(${update.id})">Delete</button>
                      </div>
                    </div>`
                ).join("")
              : `<div class="history-no-entry">
                  No win shared
                </div>`;


          peopleHTML += `
            <div class="history-person">

              <div class="history-person-info">

                <div class="avatar ${member.avatarClass}">
                  ${member.initial}
                </div>

                <div class="history-person-name">
                  ${member.name}
                </div>

              </div>


              <div>

                <div class="history-column-title history-focus-title">
                  🎯 FOCUS
                </div>

                ${focusHTML}

              </div>


              <div>

                <div class="history-column-title history-win-title">
                  🏆 WINS
                </div>

                ${winHTML}

              </div>

            </div>
          `;
        }
      );


      html += `
        <div
          class="history-week ${index===0 ? "open" : ""}"
          id="historyWeek${index}">

          <button
            class="history-week-header"
            onclick="toggleHistoryWeek(${index})">

            <div class="history-week-left">

              <div class="history-calendar">
                📅
              </div>

              <div>

                <div class="history-week-title">
                  ${formatWeekTitle(weekStart)}
                </div>

                <div class="history-week-summary">
                  ${focusTotal} focus ${focusTotal===1 ? "item" : "items"}
                  ·
                  ${winTotal} ${winTotal===1 ? "win" : "wins"}
                </div>

              </div>

            </div>

            <div class="history-arrow">
              ▼
            </div>

          </button>


          <div class="history-body">
            ${peopleHTML}
          </div>

        </div>
      `;
    }
  );


  container.innerHTML =
    html;
}


function toggleHistoryWeek(index) {

  document
    .getElementById(
      `historyWeek${index}`
    )
    .classList
    .toggle("open");
}

let modalMode = "add";

function populateWeekOptions(selectedWeek = null) {

  const select = document.getElementById("updateWeek");
  if (!select) return;

  const currentMonday = getCurrentMonday();
  let html = "";

  for (let i = 0; i < 9; i++) {
    const monday = new Date(currentMonday);
    monday.setDate(currentMonday.getDate() - (i * 7));

    const value = formatISODate(monday);
    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);

    const label = i === 0
      ? `Current week · ${formatWeekTitle(value)}`
      : `${i} ${i === 1 ? "week" : "weeks"} ago · ${formatWeekTitle(value)}`;

    html += `<option value="${value}">${label}</option>`;
  }

  select.innerHTML = html;
  select.value = selectedWeek || formatISODate(currentMonday);
}


function openAddModal(type) {

  modalMode = "edit";

    .getElementById("updateText")

    document
      .getElementById("updateWeek")
      .value;


  const message =
    document
      .getElementById("formMessage");


  const button =
    document
      .getElementById("saveButton");


  if (!person) {

    message.className =
      "form-message error";

    message.textContent =
      "Please select your name.";

    return;
  }


  if (!text) {

    message.className =
      "form-message error";

    message.textContent =
      "Please enter your update.";

    return;
  }


  button.disabled = true;
  button.textContent = "Saving...";


  try {

    let method;
    let body;


    if (modalMode==="edit") {

      method = "PATCH";

      body = {
        id:editingId,
        person,
        type:currentType,
        text
      };

    } else {

      method = "POST";

      body = {
        week_start: selectedWeek,
        person,
        type:currentType,
        text
      };
    }


    const response =
      await fetch(
        "/api/updates",
        {
          method,
          headers:{
            "Content-Type":
              "application/json",
            "X-Team-Code": getTeamCode()
          },
          body:
            JSON.stringify(body)
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to save."
      );
    }


    message.className =
      "form-message success";


    message.textContent =
      modalMode==="edit"
        ? "Update saved successfully."
        : "Added successfully.";


    await loadUpdates();


    setTimeout(
      closeModal,
      450
    );

  } catch(error) {

    message.className =
      "form-message error";

    message.textContent =
      error.message;

  } finally {

    button.disabled = false;

    configureModal(
      currentType
    );
  }
}


/* DELETE */

async function deleteUpdate(id) {

  const update =
    allUpdates.find(
      u =>
        Number(u.id)===Number(id)
    );


  if (!update) return;


  const label =
    update.type==="focus"
      ? "focus"
      : "win";


  const confirmed =
    confirm(
      `Delete this ${label}?\n\n${update.text}`
    );


  if (!confirmed) return;


  try {

    const response =
      await fetch(
        "/api/updates",
        {
          method:"DELETE",

          headers:{
            "Content-Type":
              "application/json",
            "X-Team-Code": getTeamCode()
          },

          body:
            JSON.stringify({
              id:update.id,
              person:update.person,
              type:update.type
            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to delete."
      );
    }


    await loadUpdates();


  } catch(error) {

    alert(
      "Delete failed: " +
      error.message
    );
  }
}


/* YEAR IN REVIEW */

let selectedYearPerson = "Team";


function setYearPerson(person) {

  
selectedYearPerson = person;

  document
    .querySelectorAll(".year-tab")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.person===person
      );
    });


  renderYearReview();
}


function getYearRecords() {

  const year =
    String(
      new Date().getFullYear()
    );


  return allUpdates.filter(
    update =>
      update.week_start &&
      update.week_start.startsWith(year) &&
      (
        selectedYearPerson==="Team" ||
        update.person===selectedYearPerson
      )
  );
}


function renderYearReview() {

  const year =
    new Date().getFullYear();


  document
    .getElementById("reviewYear")
    .textContent =
      year;


  const records =
    getYearRecords();


  const activeWeeks =
    new Set(
      records.map(
        update => update.week_start
      )
    ).size;


  const focusTotal =
    records.filter(
      update => update.type==="focus"
    ).length;


  const winTotal =
    records.filter(
      update => update.type==="win"
    ).length;


  document
    .getElementById("weeksNumber")
    .textContent =
      activeWeeks;


  document
    .getElementById("focusCount")
    .textContent =
      focusTotal;


  document
    .getElementById("winCount")
    .textContent =
      winTotal;


  document
    .getElementById("yearSubtitle")
    .textContent =
      selectedYearPerson==="Team"
        ? "Team activity across the year"
        : `${selectedYearPerson}'s activity across the year`;


  document
    .getElementById("monthlyDescription")
    .textContent =
      selectedYearPerson==="Team"
        ? "Focus and wins recorded by Megan, Penny and Nikki, grouped by month."
        : `${selectedYearPerson}'s focus and wins, grouped by month.`;


  renderMonthlyHighlights(records);

  renderKeywordCloud();
}


function renderMonthlyHighlights(records) {

  const container =
    document.getElementById(
      "monthlyHighlights"
    );


  if (!records.length) {

    container.innerHTML =
      `<div class="year-empty">
        No updates recorded for this view yet.
      </div>`;

    return;
  }


  const monthKeys =
    [
      ...new Set(
        records.map(update =>
          update.week_start.slice(0,7)
        )
      )
    ]
    .sort()
    .reverse();


  let html = "";


  monthKeys.forEach(
    (monthKey,index) => {

      const monthRecords =
        records.filter(
          update =>
            update.week_start.startsWith(monthKey)
        );


      const monthDate =
        parseDate(
          `${monthKey}-01`
        );


      const monthName =
        monthDate.toLocaleDateString(
          "en-AU",
          {
            month:"long",
            year:"numeric"
          }
        );


      const focusTotal =
        monthRecords.filter(
          update =>
            update.type==="focus"
        ).length;


      const winTotal =
        monthRecords.filter(
          update =>
            update.type==="win"
        ).length;


      let bodyHTML = "";


      const membersToShow =
        selectedYearPerson==="Team"
          ? teamMembers
          : teamMembers.filter(
              member =>
                member.name===selectedYearPerson
            );


      membersToShow.forEach(
        member => {

          const personRecords =
            monthRecords.filter(
              update =>
                update.person===member.name
            );


          if (
            selectedYearPerson==="Team" &&
            !personRecords.length
          ) {
            return;
          }


          const focuses =
            personRecords.filter(
              update =>
                update.type==="focus"
            );


          const wins =
            personRecords.filter(
              update =>
                update.type==="win"
            );


          const focusHTML =
            focuses.length
              ? focuses.map(
                  update =>
                    `<div class="month-entry">
                      <div class="month-entry-week">
                        ${formatWeekTitle(update.week_start)}
                      </div>
                      <div class="month-entry-text">
                        ${escapeHTML(String(update.text || "").trim())}
                      </div>
                    </div>`
                ).join("")
              : `<div class="month-empty">
                  No focus recorded
                </div>`;


          const winHTML =
            wins.length
              ? wins.map(
                  update =>
                    `<div class="month-entry">
                      <div class="month-entry-week">
                        ${formatWeekTitle(update.week_start)}
                      </div>
                      <div class="month-entry-text">
                        ${escapeHTML(String(update.text || "").trim())}
                      </div>
                    </div>`
                ).join("")
              : `<div class="month-empty">
                  No win recorded
                </div>`;


          bodyHTML += `
            <div class="month-person">

              <div class="month-person-heading">
                <div class="avatar ${member.avatarClass}">
                  ${member.initial}
                </div>
                <div class="month-person-name">
                  ${member.name}
                </div>
              </div>

              <div class="month-columns">

                <div>
                  <div class="month-column-title month-focus-title">
                    🎯 FOCUS
                  </div>
                  ${focusHTML}
                </div>

                <div>
                  <div class="month-column-title month-win-title">
                    🏆 WINS
                  </div>
                  ${winHTML}
                </div>

              </div>

            </div>
          `;
        }
      );


      html += `
        <div class="month-card ${index===0 ? "open" : ""}" id="yearMonth${index}">

          <button class="month-header" onclick="toggleYearMonth(${index})">

            <div>
              <div class="month-title">
                ${monthName}
              </div>

              <div class="month-summary">
                ${focusTotal} focus ${focusTotal===1 ? "item" : "items"}
                ·
                ${winTotal} ${winTotal===1 ? "win" : "wins"}
              </div>
            </div>

            <div class="month-arrow">▼</div>

          </button>

          <div class="month-body">
            ${bodyHTML}
          </div>

        </div>
      `;
    }
  );


  container.innerHTML =
    html;
}


function toggleYearMonth(index) {

  document
    .getElementById(
      `yearMonth${index}`
    )
    .classList
    .toggle("open");
}


function updateYear() {

  document
    .getElementById("reviewYear")
    .textContent =
      new Date().getFullYear();
}

function scrollToSection(id) {

  const element =
    document.getElementById(id);

  if (element) {

    element.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

document
  .getElementById("updateModal")
  .addEventListener(
    "click",
    function(event) {

      if (event.target===this) {
        closeModal();
      }
    }
  );


/* START */

startTeamPulse();
